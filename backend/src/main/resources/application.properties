spring.application.name=akai

# OPENAI_API_KEY는 backend/.env에서 읽는다 (.env는 커밋하지 않는다)
spring.config.import=optional:file:.env[.properties]

# H2 파일 모드 (backend/data/akai.mv.db)
spring.datasource.url=jdbc:h2:file:./data/akai
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# 업로드
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload-dir=./uploads
# 20MB를 넘는 요청도 끝까지 읽어서 413 안내를 보낸다 (기본 2MB를 넘으면 Tomcat이 연결을 끊음)
server.tomcat.max-swallow-size=50MB

# 로그인 (F-08) — 세션 쿠키를 같은 사이트 요청에만 보낸다(CSRF 방지)
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=60m
# users 테이블이 비어 있으면 샘플 계정(admin01·member01 등)을 만든다. 비밀번호는 db/sample-data.sql과 같다
app.initial-accounts.enabled=true
app.initial-accounts.password=akai1234

# OpenAI (키를 읽는 곳은 OpenAiAdapter 하나뿐이다)
openai.api-key=${OPENAI_API_KEY:}
# 사용할 모델은 12주차 구현 때 정한다
openai.model=
